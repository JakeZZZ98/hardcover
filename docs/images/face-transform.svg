<text x="595.0" y="286.0" font-size="12" fill="#8A2F3A" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">sx = (B′x − A′x) / 0.6w</text>
<text x="595.0" y="304.0" font-size="12" fill="#8A2F3A" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">sy = (C′y − A′y) / h</text>
<text x="595.0" y="322.0" font-size="12" fill="#8A2F3A" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">tx = A′x − 0.2w·sx, ty = A′y</text>
<text x="24.0" y="36.0" font-size="17" fill="#2B2620" text-anchor="start" font-weight="bold">Where does the HTML go? Ask the shader.</text>
<text x="24.0" y="58.0" font-size="13" fill="#8A7F70" text-anchor="start">three points of the page follow the same maths the GPU applies to that spot of paper</text>
