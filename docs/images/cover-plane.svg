<line x1="192.0" y1="279.6" x2="297.2" y2="81.8" stroke="#2B2620" stroke-width="6" stroke-linecap="round"/>
<text x="307.2" y="85.8" font-size="13" fill="#2B2620" text-anchor="start">cover (θc)</text>
<line x1="250.0" y1="304.8" x2="384.2" y2="105.8" stroke="#8A2F3A" stroke-width="2.5" stroke-linecap="round"/>
