<text x="293.6" y="269.1" font-size="12" fill="#8A2F3A" text-anchor="start">u = ¼</text>
<circle cx="317.1" cy="205.3" r="4.5" fill="#8A2F3A"/>
<text x="327.1" y="219.3" font-size="12" fill="#8A2F3A" text-anchor="start">u = ½</text>
<circle cx="384.2" cy="105.8" r="4.5" fill="#8A2F3A"/>
<text x="394.2" y="119.8" font-size="12" fill="#8A2F3A" text-anchor="start">u = 1</text>
<text x="24.0" y="36.0" font-size="17" fill="#2B2620" text-anchor="start" font-weight="bold">The cover hinges on a moving point</text>
<text x="24.0" y="58.0" font-size="13" fill="#8A7F70" text-anchor="start">so a leaf is limited by the cover's plane, not its angle (hinge path exaggerated)</text>
<text x="470.0" y="110.0" font-size="13" fill="#2B2620" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">clearance(u) = signed distance</text>
<text x="470.0" y="128.0" font-size="13" fill="#2B2620" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">to the cover's inner plane</text>
<text x="470.0" y="158.0" font-size="13" fill="#8A7F70" text-anchor="start">coverLimit: bisect for the</text>
<text x="470.0" y="176.0" font-size="13" fill="#8A7F70" text-anchor="start">largest leaf angle with</text>
<text x="470.0" y="194.0" font-size="13" fill="#8A7F70" text-anchor="start">clearance ≥ 0 at u = ¼, ½, 1</text>
<text x="470.0" y="230.0" font-size="13" fill="#3E6A8A" text-anchor="start">The hinge path bulges round the</text>
<text x="470.0" y="248.0" font-size="13" fill="#3E6A8A" text-anchor="start">back of the block, like spine cloth.</text>
