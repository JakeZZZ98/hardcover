<line x1="250.0" y1="306.0" x2="576.4" y2="304.8" stroke="#8A7F70" stroke-width="1.5" stroke-linecap="round"/>
<text x="490.0" y="358.0" font-size="12" fill="#8A7F70" text-anchor="middle" font-style="italic">the block (right-hand pages)</text>
