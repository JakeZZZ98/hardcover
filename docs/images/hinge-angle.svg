<rect width="720" height="320" rx="14" fill="#F6F1E6"/>
<rect x="100" y="254" width="520" height="16" rx="3" fill="#D9CFBD"/>
<text x="360.0" y="294.0" font-size="12" fill="#8A7F70" text-anchor="middle" font-style="italic">the block, seen from its tail</text>
<line x1="360.0" y1="250.0" x2="600.0" y2="250.0" stroke="#2B2620" stroke-width="3" stroke-linecap="round"/>
<line x1="360.0" y1="250.0" x2="120.0" y2="250.0" stroke="#2B2620" stroke-width="3" stroke-linecap="round"/>
