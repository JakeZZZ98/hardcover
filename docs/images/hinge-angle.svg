<text x="442.0" y="216.0" font-size="18" fill="#8A2F3A" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-style="italic">θ</text>
<circle cx="360.0" cy="250.0" r="6" fill="#2B2620"/>
<text x="360.0" y="278.0" font-size="12" fill="#8A7F70" text-anchor="middle">spine</text>
<text x="596.0" y="238.0" font-size="14" fill="#2B2620" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">θ = 0  (lying right)</text>
<text x="124.0" y="238.0" font-size="14" fill="#2B2620" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">θ = π  (lying left)</text>
<text x="497.3" y="116.9" font-size="14" fill="#8A2F3A" text-anchor="start">a turning leaf</text>
<text x="24.0" y="36.0" font-size="17" fill="#2B2620" text-anchor="start" font-weight="bold">Every sheet is one angle about the spine</text>
<text x="24.0" y="58.0" font-size="13" fill="#8A7F70" text-anchor="start">leaves, the flyleaf and the cover alike: θ, its velocity ω, and a mode</text>
