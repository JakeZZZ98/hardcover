<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2620">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2620"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A2F3A"/></marker></defs>
<rect width="720" height="300" rx="14" fill="#F6F1E6"/>
<rect x="24" y="96" width="196" height="120" rx="10" fill="#FFFDF7" stroke="#2B2620" stroke-width="1.5"/>
<text x="40.0" y="124.0" font-size="15" fill="#8A2F3A" text-anchor="start" font-weight="bold">at rest</text>
<text x="40.0" y="150.0" font-size="13" fill="#2B2620" text-anchor="start">paper: blank</text>
<text x="40.0" y="170.0" font-size="13" fill="#2B2620" text-anchor="start">HTML: on the page,</text>
<text x="40.0" y="190.0" font-size="13" fill="#2B2620" text-anchor="start">interactive</text>
<rect x="262" y="96" width="196" height="120" rx="10" fill="#FFFDF7" stroke="#2B2620" stroke-width="1.5"/>
<text x="278.0" y="124.0" font-size="15" fill="#8A2F3A" text-anchor="start" font-weight="bold">moving</text>
<text x="278.0" y="150.0" font-size="13" fill="#2B2620" text-anchor="start">paper: printed</text>
<text x="278.0" y="170.0" font-size="13" fill="#2B2620" text-anchor="start">from the HTML</text>
<text x="278.0" y="190.0" font-size="13" fill="#2B2620" text-anchor="start">HTML: opacity 0, inert</text>
<rect x="500" y="96" width="196" height="120" rx="10" fill="#FFFDF7" stroke="#2B2620" stroke-width="1.5"/>
<text x="516.0" y="124.0" font-size="15" fill="#8A2F3A" text-anchor="start" font-weight="bold">landed</text>
<text x="516.0" y="150.0" font-size="13" fill="#2B2620" text-anchor="start">swap to blank paper,</text>
<text x="516.0" y="170.0" font-size="13" fill="#2B2620" text-anchor="start">show the HTML,</text>
<text x="516.0" y="190.0" font-size="13" fill="#2B2620" text-anchor="start">draw ONE more frame</text>
<line x1="222.0" y1="156.0" x2="258.0" y2="156.0" stroke="#2B2620" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="240.0" y="244.0" font-size="12" fill="#8A7F70" text-anchor="middle">pointer down</text>
<text x="240.0" y="262.0" font-size="12" fill="#8A7F70" text-anchor="middle">or a key</text>
<line x1="460.0" y1="156.0" x2="496.0" y2="156.0" stroke="#2B2620" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="478.0" y="244.0" font-size="12" fill="#8A7F70" text-anchor="middle">engine idle,</text>
<text x="478.0" y="262.0" font-size="12" fill="#8A7F70" text-anchor="middle">camera still</text>
<path d="M598,96 C598,70 122,70 122,92" stroke="#8A7F70" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="360.0" y="66.0" font-size="12" fill="#8A7F70" text-anchor="middle" font-style="italic">then the loop sleeps</text>
<text x="24.0" y="36.0" font-size="17" fill="#2B2620" text-anchor="start" font-weight="bold">Real HTML on the paper</text>
<text x="696.0" y="286.0" font-size="12" fill="#8A7F70" text-anchor="end">blank paper under the HTML avoids printing every letter twice</text>
</svg>
