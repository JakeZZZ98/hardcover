<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2620">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2620"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A2F3A"/></marker></defs>
<rect width="720" height="370" rx="14" fill="#F6F1E6"/>
<rect x="100" y="294" width="250" height="14" rx="3" fill="#D9CFBD"/>
<line x1="120.0" y1="290.0" x2="292.0" y2="169.5" stroke="#8A7F70" stroke-width="3" stroke-linecap="round"/>
<line x1="292.0" y1="169.5" x2="292.0" y2="320.0" stroke="#8A7F70" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<circle cx="292.0" cy="169.5" r="5" fill="#8A7F70"/>
<line x1="120.0" y1="290.0" x2="205.4" y2="98.2" stroke="#8A2F3A" stroke-width="3" stroke-linecap="round"/>
<line x1="205.4" y1="98.2" x2="205.4" y2="320.0" stroke="#8A2F3A" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
<circle cx="205.4" cy="98.2" r="5" fill="#8A2F3A"/>
<circle cx="120.0" cy="290.0" r="6" fill="#2B2620"/>
<line x1="292.0" y1="332.0" x2="211.4" y2="332.0" stroke="#2B2620" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="248.7" y="352.0" font-size="13" fill="#2B2620" text-anchor="middle">pointer moves Δx</text>
<text x="300.0" y="161.5" font-size="13" fill="#8A7F70" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">at grab: x₀ = W cos θ</text>
<text x="217.4" y="102.2" font-size="13" fill="#8A2F3A" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">θ_target</text>
<text x="470.0" y="200.0" font-size="14" fill="#2B2620" text-anchor="start">The tip's shadow stays</text>
<text x="470.0" y="218.0" font-size="14" fill="#2B2620" text-anchor="start">under the finger:</text>
<text x="470.0" y="250.0" font-size="14" fill="#8A2F3A" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">acos((x₀ + Δx) / W)</text>
<text x="470.0" y="284.0" font-size="13" fill="#8A7F70" text-anchor="start">θ chases it on a critically</text>
<text x="470.0" y="302.0" font-size="13" fill="#8A7F70" text-anchor="start">damped spring (40 ms response).</text>
<text x="24.0" y="36.0" font-size="17" fill="#2B2620" text-anchor="start" font-weight="bold">Following the hand</text>
<text x="24.0" y="58.0" font-size="13" fill="#8A7F70" text-anchor="start">side view; W = page width</text>
</svg>
